services:
  # ──────────────────────────────────────────────
  #  MongoDB
  # ──────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: saci-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USER:-saci_user}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASS:-saci_password}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  #  API SACP
  # ──────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saci-api
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Sobrescribir el host de BD para apuntar al contenedor MongoDB
      DB_HOST: mongodb
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
